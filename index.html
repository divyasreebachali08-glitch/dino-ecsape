<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dino Escapade - 2D Desert Runner</title>
  <meta name="description"
    content="Dino Escapade: A 2D side-scrolling endless runner where you run through the desert, collect meat, power up, and blast stone obstacles with fireball attacks!">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="game-wrapper">
    <!-- Main Game Canvas -->
    <canvas id="game-canvas" width="1600" height="900"></canvas>

    <!-- In-Game UI HUD Overlay -->
    <div id="ui-layer">
      <!-- Top HUD Header -->
      <div class="hud-top">
        <!-- Power Gauges (Top Left) -->
        <div class="hud-gauges">
          <!-- Meat / Strength Gauge -->
          <div class="gauge-widget" id="strength-gauge-widget" title="Collect meat to power up!">
            <svg class="gauge-svg" viewBox="0 0 76 76">
              <circle class="gauge-bg-ring" cx="38" cy="38" r="32"></circle>
              <circle id="strength-gauge-ring" class="gauge-progress-ring" cx="38" cy="38" r="32" stroke-dasharray="201"
                stroke-dashoffset="201"></circle>
            </svg>
            <img id="strength-icon-img" class="gauge-icon" src="assets/icon_strength.png" alt="Strength Gauge">
          </div>

          <!-- Fire Attack Gauge / Button -->
          <div class="gauge-widget" id="fire-gauge-widget" title="Fire Attack (Press F)">
            <svg class="gauge-svg" viewBox="0 0 76 76">
              <circle class="gauge-bg-ring" cx="38" cy="38" r="32"></circle>
              <circle id="fire-gauge-ring" class="gauge-progress-ring" cx="38" cy="38" r="32" stroke-dasharray="201"
                stroke-dashoffset="201"></circle>
            </svg>
            <img class="gauge-icon" src="assets/icon_fire.png" alt="Fireball Attack">
          </div>
        </div>

        <!-- Center Stats (Meat, Score, Distance) -->
        <div class="hud-center-stats">
          <div class="stat-group">
            <img class="stat-icon" src="assets/meat.png" alt="Meat">
            <span class="stat-value" id="hud-meat">0</span>
          </div>
          <div class="stat-group">
            <span class="stat-label">Score</span>
            <span class="stat-value" id="hud-score">0</span>
          </div>
          <div class="stat-group">
            <span class="stat-label">Dist</span>
            <span class="stat-value" id="hud-distance">0m</span>
          </div>
        </div>

        <!-- Action Buttons (Top Right) -->
        <div class="hud-actions">
          <!-- Automatic Day/Night Indicator & Toggle -->
          <button class="hud-round-btn" id="btn-theme-toggle" title="Automatic Day/Night Cycle (Click to change mode)"
            aria-label="Day Night Toggle">
            <svg id="theme-icon-sun" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="5" />
              <path
                d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <svg id="theme-icon-moon" style="display:none;" viewBox="0 0 24 24">
              <path
                d="M12.3 2a10 10 0 0 0 1.9 19.8 10 10 0 0 0 7.8-3.8 1 1 0 0 0-.8-1.6 8 8 0 0 1-6.1-13.6 1 1 0 0 0-.6-1.8 9.9 9.9 0 0 0-2.2-0.2z" />
            </svg>
          </button>

          <!-- Audio Mute Toggle -->
          <button class="hud-round-btn" id="btn-audio-toggle" title="Toggle Sound (M)" aria-label="Toggle Sound">
            <svg id="audio-icon-on" viewBox="0 0 24 24">
              <path
                d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" />
            </svg>
          </button>

          <!-- Pause Button (Matching game.jpeg top right) -->
          <button class="hud-round-btn" id="btn-pause" title="Pause Game (P or Esc)" aria-label="Pause Game">
            <svg id="pause-icon" viewBox="0 0 24 24">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Power Up Banner Notification -->
      <div id="power-alert">FIREBALL POWER ACTIVATED!</div>

      <!-- Bottom Controls (Mobile Buttons & Hints) -->
      <div class="hud-bottom">
        <div class="controls-hint">
          <span>[Space / W / Click] JUMP &bull; [F] FIREBALL &bull; [P] PAUSE</span>
        </div>
        <div style="display:flex; gap:16px;">
          <button class="touch-btn fire-btn" id="btn-touch-fire">
            <img src="assets/fireball.png" style="height:26px;" alt=""> FIRE!
          </button>
          <button class="touch-btn" id="btn-touch-jump">
            JUMP!
          </button>
        </div>
      </div>
    </div>

    <!-- ======================================================= -->
    <!-- DEDICATED LOADING SCREEN OVERLAY -->
    <!-- ======================================================= -->
    <div id="loading-screen">
      <div class="loading-logo-container">
        <img class="loading-title-img" src="assets/title_logo.png" alt="DINO ESCAPADE">
        <div class="loading-tagline">2D DESERT ENDLESS RUNNER</div>
      </div>

      <!-- Green-to-yellow gradient loading bar with dino head -->
      <div class="loading-bar-wrapper">
        <div class="loading-bar-fill" id="loading-bar-fill"></div>
        <img class="loading-dino-head" id="loading-dino-head" src="assets/dino_head.png" alt="Dino Progress">
      </div>

      <div class="loading-status-text" id="loading-status">LOADING DESERT TRACK...</div>
      <button class="start-btn" id="btn-start-game">START RUN!</button>
    </div>

    <!-- ======================================================= -->
    <!-- PAUSE MODAL (Matching pause.jpeg) -->
    <!-- ======================================================= -->
    <div id="pause-modal">
      <div class="pause-card">
        <div class="pause-title">PAUSED</div>
        <div class="menu-buttons-list">
          <!-- Resume Button -->
          <button class="menu-btn" id="btn-resume">
            <div class="menu-btn-circle">
              <!-- Play Triangle Icon -->
              <svg viewBox="0 0 24 24">
                <polygon points="6,4 20,12 6,20" />
              </svg>
            </div>
            <span class="menu-btn-text">RESUME</span>
          </button>

          <!-- Replay Button -->
          <button class="menu-btn" id="btn-pause-replay">
            <div class="menu-btn-circle">
              <!-- Circular Arrow Icon -->
              <svg viewBox="0 0 24 24">
                <path
                  d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
              </svg>
            </div>
            <span class="menu-btn-text">REPLAY</span>
          </button>

          <!-- Home Button -->
          <button class="menu-btn" id="btn-pause-home">
            <div class="menu-btn-circle">
              <!-- House Icon -->
              <svg viewBox="0 0 24 24">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
              </svg>
            </div>
            <span class="menu-btn-text">HOME</span>
          </button>
        </div>
      </div>
    </div>

    <!-- ======================================================= -->
    <!-- GAME OVER MODAL (DEAD!!! Matching loose icons.jpeg) -->
    <!-- ======================================================= -->
    <div id="gameover-modal">
      <div class="gameover-card">
        <div class="gameover-title">DEAD!!!</div>

        <!-- Run Stats Summary -->
        <div class="gameover-stats-grid">
          <div class="go-stat-item">
            <span class="go-stat-label">Final Score</span>
            <span class="go-stat-val" id="go-score">0</span>
          </div>
          <div class="go-stat-item">
            <span class="go-stat-label">High Score</span>
            <span class="go-stat-val" id="go-highscore">0</span>
          </div>
          <div class="go-stat-item">
            <span class="go-stat-label">Meat Eaten</span>
            <span class="go-stat-val" id="go-meat">0</span>
          </div>
          <div class="go-stat-item">
            <span class="go-stat-label">Rocks Blasted</span>
            <span class="go-stat-val" id="go-rocks">0</span>
          </div>
        </div>

        <!-- Two Circular Buttons: Replay & Home -->
        <div class="gameover-buttons-row">
          <button class="go-circle-btn" id="btn-go-replay" title="Replay">
            <svg viewBox="0 0 24 24">
              <path
                d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z" />
            </svg>
          </button>
          <button class="go-circle-btn" id="btn-go-home" title="Home">
            <svg viewBox="0 0 24 24">
              <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z" />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Game Logic Script -->
  <script src="game.js"></script>
</body>

</html>
